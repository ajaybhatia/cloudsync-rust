[package]
name = "cloudsync-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
http-body-util = "0.1.5"
jsonwebtoken = "11.1.0"
once_cell = "1.21.4"
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-appender-tracing = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", features = ["http-proto"], optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true }
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simple_dto_mapper_derive = "0.1.1"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry", "std", "fmt", "chrono"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[features]
opentelemetry = ["dep:opentelemetry"]
opentelemetry_sdk = ["dep:opentelemetry_sdk"]
opentelemetry-otlp = ["dep:opentelemetry-otlp"]
opentelemetry-appender-tracing = ["dep:opentelemetry-appender-tracing"]
tracing-opentelemetry = ["dep:tracing-opentelemetry"]
